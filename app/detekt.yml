# Detekt Configuration for MyBookshelf
# https://detekt.dev/docs/rules/

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

# Formatting rules (from detekt-formatting module / ktlint)
# Most config is in .editorconfig, but we can disable categories here
formatting:
  active: true
  # Let .editorconfig handle specific rule config

complexity:
  LongMethod:
    threshold: 100
    excludes: ['**/presentation/**']
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 15
    excludes: ['**/presentation/**']
  LargeClass:
    threshold: 500
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 20
    thresholdInEnums: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    allowedExceptionNameRegex: "_|(ignore|expected).*"

exceptions:
  active: true
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/androidTest/**']
  TooGenericExceptionThrown:
    active: true

naming:
  active: true
  FunctionNaming:
    # Handled by ktlint via .editorconfig (ignore @Composable, @Test)
    active: false
  PackageNaming:
    # Project uses underscores (book_detail, search_components)
    active: false

performance:
  active: true
  SpreadOperator:
    excludes: ['**/test/**', '**/androidTest/**']

potential-bugs:
  active: true

style:
  active: true
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/presentation/**']
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
  MaxLineLength:
    excludes: ['**/test/**', '**/androidTest/**']
    maxLineLength: 120
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedPrivateMember:
    allowedNames: "(_|ignored|expected|serialVersionUID|.*Preview)"
  WildcardImport:
    excludes: ['**/test/**', '**/androidTest/**']
