<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share - My Bookshelf</title>

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="My Bookshelf - Share your reading journey">
    <meta property="og:description" content="Join Book Clubs and share bookshelves with friends. Organize your reading collection beautifully.">
    <meta property="og:image" content="https://zlurgg.github.io/My-Bookshelf/assets/social-preview.png">
    <meta property="og:url" content="https://zlurgg.github.io/My-Bookshelf/share/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Bookshelf - Share your reading journey">
    <meta name="twitter:description" content="Join Book Clubs and share bookshelves with friends. Organize your reading collection beautifully.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #FAF7F3;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Shelf texture background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/shelf_wood_textured_brown.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.15;
            z-index: -1;
        }

        .container {
            max-width: 540px;
            width: 100%;
            background: #F5EFEA;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 4px 6px rgba(109, 76, 65, 0.1),
                0 12px 24px rgba(109, 76, 65, 0.08);
            border: 1px solid rgba(109, 76, 65, 0.1);
            text-align: center;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #6D4C41;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #51443D;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #FFF;
            border: 2px solid rgba(109, 76, 65, 0.2);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            text-decoration: none;
            color: #6D4C41;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: #8E6C88;
            background: rgba(142, 108, 136, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(142, 108, 136, 0.15);
        }

        .option-btn:hover .option-arrow {
            transform: translateX(4px);
            color: #8E6C88;
        }

        .option-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .option-text {
            text-align: left;
            flex-grow: 1;
        }

        .option-title {
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .option-desc {
            font-size: 0.9rem;
            color: #51443D;
        }

        .option-arrow {
            font-size: 1.5rem;
            color: rgba(109, 76, 65, 0.4);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .download-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(109, 76, 65, 0.1);
        }

        .download-btn {
            background: #8E6C88;
            color: white;
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:hover {
            background: #7A5976;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="book-icon">📚</div>
        <h1>My Bookshelf</h1>
        <p class="subtitle">Share your reading with friends</p>

        <div class="options">
            <a href="./club/" class="option-btn">
                <span class="option-icon">👥</span>
                <div class="option-text">
                    <div class="option-title">Join a Book Club</div>
                    <div class="option-desc">Join a shared reading group with friends</div>
                </div>
                <span class="option-arrow">→</span>
            </a>

        </div>

        <div class="download-section">
            <a href="https://play.google.com/store/apps/details?id=uk.co.zlurgg.mybookshelf" class="download-btn">
                ▶ Get it on Google Play
            </a>
        </div>
    </div>
</body>
</html>
