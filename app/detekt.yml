# Detekt Configuration for MyBookshelf
# https://detekt.dev/docs/rules/

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 100
    # Compose UIs are often long - focus on non-UI code
    excludes: ['**/presentation/**']
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 15
    # Compose callbacks often require many parameters
    excludes: ['**/presentation/**']
  LargeClass:
    threshold: 500
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 20
    thresholdInEnums: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKtFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  TooGenericExceptionThrown:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    # Exclude Compose UI (uses PascalCase for @Composable functions)
    excludes: ['**/test/**', '**/androidTest/**', '**/presentation/**']
    functionPattern: '[a-z][a-zA-Z0-9]*'
  PackageNaming:
    # Disabled - project uses underscores (book_detail, search_components)
    active: false
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '_?[a-z][A-Za-z0-9]*'

performance:
  active: true
  SpreadOperator:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCatchBlock:
    active: true
  UnsafeCallOnNullableType:
    active: false  # Disabled - Kotlin's null safety handles this

style:
  active: true
  MagicNumber:
    active: true
    # UI code commonly uses numeric literals for dimensions, colors, etc.
    excludes: ['**/test/**', '**/androidTest/**', '**/presentation/**']
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '1000'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
    excludes: ['**/test/**', '**/androidTest/**']
  NewLineAtEndOfFile:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  ReturnCount:
    active: true
    max: 4
    excludeLabeled: true
    excludeReturnFromLambda: true
    excludeGuardClauses: true
  UnusedPrivateMember:
    active: true
    # Allow Preview functions (used by Android Studio for Compose previews)
    allowedNames: "(_|ignored|expected|serialVersionUID|.*Preview)"
  WildcardImport:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.android.synthetic.*'
